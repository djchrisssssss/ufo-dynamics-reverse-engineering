name: Validate Repository

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Install validator dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run validator unit tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Run deterministic repository validation
        run: python scripts/validate_repository.py

  latex:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build paper
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          working_directory: latex
          root_file: main.tex
          docker_image: ghcr.io/xu-cheng/texlive-full@sha256:8b4a00b6a17ebe6b96dee107d82f0cb3eb40daf322f1e23809a9be26486963dd
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Reject unresolved LaTeX references
        shell: bash
        run: |
          if grep -Eqi 'undefined (citations|references)|Citation .* undefined|Reference .* undefined' latex/main.log; then
            echo "Unresolved LaTeX citations or references detected"
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ufo-dynamics-paper
          path: latex/main.pdf
          retention-days: 30
